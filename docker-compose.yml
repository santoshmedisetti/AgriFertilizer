version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: agriftilizer_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: agriftilizer_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/agriftilizer
      # ADD YOUR OTHER ENV VARS HERE (JWT_SECRET, RAZORPAY_KEY, CLOUDINARY, SMTP)
    depends_on:
      - mongodb
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./client
      # For dev, we just use a basic node image instead of nginx
      dockerfile: Dockerfile.dev 
    container_name: agriftilizer_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  mongo_data:
